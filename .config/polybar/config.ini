; Nord-inspired Polybar for i3.

[colors]
background = #1E222A
surface = #282C34
foreground = #D8DEE9
muted = #7F8796
primary = #88C0D0
accent = #A3BE8C
alert = #BF616A

[bar/main]
width = 100%
height = 28pt
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 1
padding-right = 1
module-margin = 1
separator = ""
font-0 = "JetBrainsMono Nerd Font:pixelsize=12;1"
font-1 = "Noto Serif CJK SC:size=11;1"
modules-left = i3 xwindow
modules-center = clock media
modules-right = language wlan volume battery power

[module/media]
type = custom/script
exec = ~/.config/polybar/player_control.sh
interval = 1
format-padding = 1
format-foreground = ${colors.primary}

[module/i3]
type = internal/i3
pin-workspaces = true
format = <label-state>
format-padding = 1
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

; The focused title replaces i3's normal title bar.
[module/xwindow]
type = internal/xwindow
label = %title%
label-maxlen = 70
label-empty = Desktop
format-padding = 1
format-foreground = ${colors.muted}

[module/language]
type = custom/script
exec = ~/.config/polybar/scripts/input-language.sh
interval = 1
click-left = ~/.config/polybar/scripts/input-language.sh --toggle
format-padding = 1
format-foreground = ${colors.accent}
label = %output%

[module/clock]
type = custom/script
exec = ~/.config/polybar/scripts/clock.sh
interval = 1
format-padding = 1
format-foreground = ${colors.foreground}
click-left = ~/.config/polybar/scripts/open-calendar.sh

[module/wlan]
type = custom/script
exec = ~/.config/polybar/scripts/wifi-status.sh
interval = 3
format-padding = 1
format-foreground = ${colors.primary}
click-left = ~/.config/polybar/scripts/open-network.sh

[module/volume]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1
label-volume = %percentage%%
format-muted = <label-muted>
format-muted-padding = 1
label-muted =  muted
label-muted-foreground = ${colors.muted}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}
click-left = ~/.config/polybar/scripts/volume-slider.sh
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 94
format-charging = <animation-charging> <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.accent}
format-charging-padding = 1
label-charging = %percentage%%
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 1
label-discharging = %percentage%%
format-full-prefix = " "
format-full-prefix-foreground = ${colors.accent}
label-full = %percentage%%
format-full-padding = 1
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

[module/power]
type = custom/text
format = ⏻
format-padding = 1
format-foreground = ${colors.alert}
click-left = ~/.config/polybar/scripts/power-menu.sh
